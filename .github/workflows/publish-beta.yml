name: publish-beta

on:
  push:
    tags:
      - "v*-beta*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to publish"
        required: false
        type: string
      dry_run:
        description: "Dry-run only"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish-beta:
    name: publish-beta
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Plugin
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          path: openclaw-memory-libravdb

      - name: Checkout Contracts
        uses: actions/checkout@v4
        with:
          repository: zephyr-systems/libravdb-contracts
          ref: main
          path: libravdb-contracts

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: 'pnpm'
          cache-dependency-path: openclaw-memory-libravdb/pnpm-lock.yaml

      - name: Install dependencies
        if: github.event.inputs.dry_run != 'true'
        working-directory: openclaw-memory-libravdb
        run: pnpm install --frozen-lockfile

      - name: Install dependencies (dry-run)
        if: github.event.inputs.dry_run == 'true'
        working-directory: openclaw-memory-libravdb
        run: pnpm install --no-frozen-lockfile

      - name: Verify beta tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: openclaw-memory-libravdb
        run: |
          node -e '
            const pkg = require("./package.json");
            const tag = process.env.RELEASE_TAG.replace(/^refs\/tags\/v/, "");
            if (pkg.version !== tag) {
              console.error(`package.json version ${pkg.version} != tag ${tag}`);
              process.exit(1);
            }
          '
        env:
          RELEASE_TAG: ${{ github.ref }}

      - name: Publish beta
        if: github.event.inputs.dry_run != 'true'
        working-directory: openclaw-memory-libravdb
        run: npm publish --access public --tag beta
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry-run publish
        if: github.event.inputs.dry_run == 'true'
        working-directory: openclaw-memory-libravdb
        run: npm publish --access public --tag beta --dry-run
